[project]
name = "dfir-triage-pipeline"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "evtx==0.12.1",
    "windowsprefetch==4.0.3",
    # Imported lazily inside parsers/registry.py and parsers/amcache.py, so a
    # missing regipy fails when a hive is parsed rather than at import time.
    # That is precisely why it has to be declared here.
    "regipy==6.3.0",
    # Pure-Python ESE reader for SRUDB.dat, imported lazily inside
    # parsers/srum.py for the same reason regipy is. Pure Python matters here:
    # the alternatives bind to libesedb, which does not build on Windows
    # without a toolchain the examiner may not have.
    "dissect.esedb==3.18",
    # Read by rules/validate_rules.py.
    "pyyaml==6.0.3",
    # Isolation Forest for the anomaly layer. Pulls in numpy and scipy.
    "scikit-learn==1.5.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.6.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dfir_triage_pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# viewer/ is Person A's separate read-only UI with its own venv and its own
# test suite (viewer/tests, run from viewer/). It imports nothing from the
# pipeline, so the pipeline's lint gate does not police it.
extend-exclude = ["viewer"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
