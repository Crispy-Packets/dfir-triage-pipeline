# Atomic rule 4 of 6. Compressed week, Day 2 (A-3).

schema_version: "1.2.0"
id: R-ATOMIC-0004
type: atomic
title: Service installed with an interpreter or user-writable image
enabled: true

description: >
  Fires on an EID 7045 service installation whose ImagePath invokes a command
  interpreter, carries an encoded command, or points into a user-writable
  directory. Claims that a service was installed with that command line and
  names the record. Claims nothing about whether the service ever started.

severity: high
weight: 55

attack:
  technique: T1543.003
  name: Create or Modify System Process - Windows Service

select:
  event_type: [service_install]
  source_artifact: [evtx.system]

conditions:
  all:
    - field: event_type
      op: equals
      value: service_install
    - field: path
      op: present
  any:
    - field: path
      op: matches
      value: '(?i)(^|[\\ "])powershell(\.exe)?([ "]|$)'
    - field: path
      op: matches
      value: '(?i)(^|[\\ "])cmd\.exe([ "]|$)'
    - field: path
      op: matches
      value: '(?i)(^|[\\ "])(wscript|cscript|mshta|rundll32|regsvr32)\.exe([ "]|$)'
    - field: path
      op: matches
      value: '(?i)\s-(enc|encodedcommand|e)\s'
    - field: path
      op: matches
      value: '(?i)\\users\\'
    - field: path
      op: matches
      value: '(?i)\\appdata\\'
    - field: path
      op: matches
      value: '(?i)\\temp\\'
    - field: path
      op: matches
      value: '(?i)\.ps1([ "]|$)'

expected:
  clean_a: 0
  clean_b: 0
  s1_v2: 0
  clean_c: 0
  s1_v3: 0
  note: >
    Measured 2026-08-30 across all three collections (A-4/A-10). Zero on all
    three, which is the result the rule was written hoping for.

    This confirms the check the previous note asked for: the 55 service_install
    rows in the corpus include the seven extra VirtualBox Guest Additions
    services in s1_v2 (16 in each baseline, 23 in s1_v2 -- D-026), and none of
    them match any pattern here. VBoxGuest, VBoxMouse, VBoxSF and VBoxWddm all
    carry system32 driver images with no interpreter and no user-writable path.
    The rule therefore does not measure the build difference between the
    scenario image and the baselines, which was the specific risk flagged when
    it was written.

    Zero on s1_v2 is not a miss: Scenario 1 establishes persistence through an
    HKCU Run value, not a service, so there is no service installation to
    detect. R-ATOMIC-0006 is the rule that carries that detection.

notes: >
  Every pattern matches against a COMMAND LINE, not a filesystem path. CD-021,
  measured across all three collections: 54 of 55 service_install rows carry
  something other than a bare path, in five forms - quoted executable with
  arguments (27), unquoted drive path with arguments (6), \SystemRoot or UNC
  device path (7), environment-variable form such as %SystemRoot% (14), and
  bare drive path (1). A rule written as though path were a filesystem path
  fires on almost nothing and reports it as "no detection", which is why the
  patterns are anchored on token boundaries rather than on path structure.

  details.ImagePath carries the same string and details.ServiceName carries the
  name; both are declared. path is used here so the rule reads the same field
  the entity resolver will later extract the executable from.

false_positive_notes: >
  %SystemRoot%\system32\svchost.exe -k <group> is the normal shape of a large
  fraction of Windows services and is deliberately not matched: svchost is not
  in the interpreter list. Legitimate installers do sometimes register services
  from under \Users or \AppData, so this rule is an indicator, not a verdict,
  and its base rate on the two developer-workstation baselines is the number
  that decides how much weight it deserves.

references:
  - "docs/contract-decisions.md CD-021, CD-007"
  - "docs/defect-log.md D-026"
