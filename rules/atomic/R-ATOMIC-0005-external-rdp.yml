# Atomic rule 5 of 6. Compressed week, Day 2 (A-3).
# This rule is expected to fire zero times on this corpus. That is a negative
# test, not a failure - see expected.note.

schema_version: "2.1.0"
id: R-ATOMIC-0005
type: atomic
title: Remote interactive logons from a network address
enabled: true
phase: delivery

description: >
  Fires once per source ADDRESS that made two or more EID 4624 logons of type
  10 (RemoteInteractive, the RDP type) within 30 days, where the address is a
  real network address rather than loopback or the log's own "not recorded"
  marker. Claims that remote interactive sessions were established from that
  address, names the first two records and the address. Claims nothing about
  who was at the other end.

severity: high
weight: 50

attack:
  technique: T1021.001
  name: Remote Services - Remote Desktop Protocol

select:
  event_type: [logon]
  source_artifact: [evtx.security]

conditions:
  all:
    - field: event_type
      op: equals
      value: logon
    - field: details.LogonType
      op: equals
      value: "10"
    - field: details.IpAddress
      op: present
  none:
    - field: details.IpAddress
      op: in
      value: ["-", "::1", "127.0.0.1", "0.0.0.0"]

aggregate:
  count: 2
  within: P30D
  group_by: entity.src_ip

# Grouped by source address (2026-09-26). On collection_srv22 this rule fired
# 807 times -- once per logon -- and 778 of those were the legitimate
# administrator working from home from one address. Grouping by entity.src_ip
# (join-only key, added the same day) makes it one finding per ADDRESS: three
# on srv22, one of them the attacker's Kali machine. count: 2 is the smallest
# the aggregate grammar allows (a count of 1 is the rule without the
# aggregate). The cost: an address with a SINGLE logon no longer fires here --
# see false_positive_notes.

expected:
  clean_a: 0
  clean_b: 0
  s1_v2: 0
  clean_c: 0
  s1_v3: 0
  note: >
    Measured 2026-08-30 across all three collections (A-4/A-10). Zero
    everywhere. The s1_v2 zero was already measured when the rule was written;
    the two baseline zeros are new and complete the picture.

    There is no RDP anywhere in this corpus. Every lab session was on the
    VirtualBox console, so no logon of type 10 was ever produced. The rule's
    positive capability is therefore evidenced only by its unit test, which is
    what that test exists for -- a rule that has never fired on real data and
    has no test proving it can fire is indistinguishable from a broken one.

    For Week 4 this is a clean negative control: three collections, no
    detections, no false positives. It contributes no discriminating signal
    between baseline and scenario and should carry no weight in any model
    trained on this corpus.

notes: >
  RFC1918 addresses are deliberately NOT excluded. The lab's attacker host sits
  on 192.168.50.x, so a rule that discarded private ranges as "internal" could
  not fire on this corpus under any circumstances, and its zero would then be
  an artefact of the rule rather than a statement about the evidence. Only
  loopback and the log's own absent-markers are excluded.

  Logon type 7 (unlock of an existing session) can also indicate RDP activity
  and is intentionally out of scope here: it is a reconnection to a session
  established earlier, so on its own it does not evidence a new remote logon.
  If it is added later it belongs in its own rule with its own weight.

  details.IpAddress may be the literal "-" as recorded (CD-022 makes the point
  that "-" is a value the log wrote, not an absent field), which is why it is
  excluded explicitly by value rather than left to op: absent.

false_positive_notes: >
  Since 2026-09-26 an address with exactly ONE remote interactive logon does
  not fire this rule. A lone attacker logon that followed password guessing is
  covered by R-CORR-0007 (failures then success from the same address) and
  R-ATOMIC-0022 (failure burst); a lone logon with valid stolen credentials
  and no guessing is the gap this trades for readability.

  Legitimate remote administration produces an identical record. On an estate
  where RDP is a normal management path this rule would be pure noise and
  should be scoped by source address or by account. On this corpus it has no
  base rate at all, which is what makes it worth its weight here and nowhere
  else.

references:
  - "docs/contract-decisions.md CD-007, CD-022"
  - "docs/details-schema.md, EVTX section, LogonType and IpAddress"
