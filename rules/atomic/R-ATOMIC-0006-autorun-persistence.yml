# Atomic rule 6 of 6. Compressed week, Day 2 (A-3).

schema_version: "1.2.0"
id: R-ATOMIC-0006
type: atomic
title: Autorun value pointing at a user-writable path or an interpreter
enabled: true

description: >
  Fires on a Run or RunOnce value whose data points into a user-writable
  location, carries an unexpanded user environment variable, or invokes an
  interpreter. Claims that the value exists in the collected hive with that
  data, and names the hive, key and value. Claims nothing about when it was
  written - see notes.

severity: high
weight: 60

attack:
  technique: T1547.001
  name: Boot or Logon Autostart Execution - Registry Run Keys / Startup Folder

select:
  event_type: [persistence_autorun]
  source_artifact: [registry]

conditions:
  all:
    - field: event_type
      op: equals
      value: persistence_autorun
    - field: path
      op: present
  any:
    - field: path
      op: matches
      value: '(?i)\\users\\'
    - field: path
      op: matches
      value: '(?i)%appdata%|%localappdata%|%temp%|%userprofile%'
    - field: path
      op: matches
      value: '(?i)\\appdata\\'
    - field: path
      op: matches
      value: '(?i)\\downloads\\'
    - field: path
      op: matches
      value: '(?i)(^|[\\ "])(powershell|cmd|wscript|cscript|mshta|rundll32|regsvr32)(\.exe)?([ "]|$)'
    - field: path
      op: matches
      value: '(?i)\s-(enc|encodedcommand|w\s+hidden|windowstyle\s+hidden)'

expected:
  clean_a: 8
  clean_b: 8
  s1_v2: 4
  clean_c: 1
  s1_v3: 2
  note: >
    Measured 2026-08-30 across all three collections (A-4/A-10). Both halves of
    the check requested when this rule was written now hold.

    The attack IS detected: the SecurityUpdate value pointing at
    C:\Users\janed\Downloads\invoice_scan.exe is among the four s1_v2 hits. On
    this corpus that makes R-ATOMIC-0006 the only atomic rule that fires on the
    actual Scenario 1 persistence, and one of only two -- with R-ATOMIC-0002 --
    that fires on the attack at all.

    The Guest Additions autoruns are NOT matched: VBoxTray and SecurityHealth
    both carry 2026-08-23T23:13:49.701914Z and both point into Program Files or
    System32, so neither matches any pattern here. The rule is not measuring the
    build difference (D-026).

    The base rate is 8 in each baseline and 3 of the 4 in s1_v2: per-user
    OneDrive.exe /background under AppData\Local, and the cmd.exe /q /c del
    cleanup values OneDrive writes during setup. These are benign and identical
    in structure to the attack -- a user-writable path in an autorun -- which is
    the honest limit of this indicator. It is a high base rate for a rule
    weighted 60, and Week 4 should expect roughly 8 findings per clean host
    before any tuning. Suppressing OneDrive by name would improve the numbers
    and would be exactly the kind of corpus-fitting that does not survive
    contact with a different estate, so it is not done here.

notes: >
  This rule makes no time claim, which is the whole reason it is safe to write
  today. Its events carry timestamp_type=presence: Event.timestamp holds the
  containing KEY's last-write time, shared by every sibling value under that
  key, and details.value_count_in_key says how many siblings there are.

  D-027 is the measured proof that this matters. The SecurityUpdate value's key
  last-write is 2026-08-21T01:34:07.976260Z while the download it points at is
  2026-08-23T22:20:06.710763Z - the persistence appears two days older than the
  file it launches, because the value was written during an earlier attempt at
  the scenario and the baseline restore before the recorded run did not clear
  it. The artifact is genuine persistence pointing at the genuine payload; only
  the timestamp belongs to an earlier attempt.

  An atomic rule is unaffected by that, because it asserts existence and
  nothing more. The correlation form of this indicator, R-CORR-0003, must join
  on entity only and report no interval - schema sections 5.2 and 5.4.

false_positive_notes: >
  Legitimate software does register autoruns under AppData - updaters
  especially - so the base rate on both baselines is what decides this rule's
  weight. The interpreter and hidden-window patterns are the discriminating
  ones; the path patterns alone are closer to an inventory than to a detection.

references:
  - "docs/contract-decisions.md CD-007, CD-010, CD-019"
  - "docs/defect-log.md D-027"
  - "docs/details-schema.md, Registry section"
