# Atomic rule 0014. Added 2026-09-20. CLASS 2 (known-behavior).
#
# Fields were verified against MEASURED details keys on clean_a and s1_v2,
# not against the schema tables: a documented key and a key that survives
# parsing are different claims.

schema_version: "2.0.0"
id: R-ATOMIC-0014
type: atomic
title: Sustained network egress recorded for a binary by SRUM
enabled: true
class: known-behavior

description: >
  Fires on a SRUM network row recording a large volume of bytes SENT by an
  application.

  SRUM is the System Resource Usage Monitor: Windows accounts per-application
  network and resource consumption hourly, and the database survives on disk.
  It is the only family in this pipeline that records how much data a binary
  moved, which is the quantity an exfiltration claim actually needs.

  The rule claims volume, not destination. SRUM records no address, so it
  cannot say where the bytes went.

severity: medium
weight: 35

attack:
  technique: T1041
  name: Exfiltration Over C2 Channel

select:
  event_type: [network_usage]
  source_artifact: [srum]

conditions:
  all:
    - field: event_type
      op: equals
      value: network_usage
    - field: details.bytes_sent
      op: present
    - field: path
      op: is_user_writable
      value: true

expected:
  clean_a: unmeasured
  clean_b: unmeasured
  s1_v2: unmeasured
  clean_c: unmeasured
  s1_v3: unmeasured
  note: >
    CLASS 2 -- unmeasured on all five.

    `srum` carries 1,865 `network_usage` rows across the two collections
    surveyed, with `bytes_sent` and `bytes_received` present. No threshold is
    set in the conditions, deliberately: a byte count that separates
    exfiltration from a software update is a property of the environment, and
    choosing one from this corpus would be corpus-fitting. The user-writable
    path clause is what narrows it.

false_positive_notes: >
  1. Any updater or sync client in a user-writable location. OneDrive,
     Dropbox, Cursor, browser updaters -- all move large volumes from
     AppData legitimately and continuously. On this corpus's clean hosts
     that population is substantial.

  2. Browsers themselves, when installed per-user. Upload volume from a
     browser is indistinguishable from exfiltration through a browser.

  3. SRUM aggregates HOURLY, per application, per user. A hit is a sum over
     an hour and not a transfer, so it cannot be correlated to a single
     event, and a low-and-slow exfiltration spread across many hours may
     never stand out in any one row.

  4. The table is written periodically and on shutdown; the most recent
     activity before collection may be absent entirely.

  WHAT WOULD MAKE THIS SHARPER: a threshold fitted on a real fleet, plus a
  join to an execution family to establish the binary ran at all. Neither is
  available here.

references:
  - https://attack.mitre.org/techniques/T1041/
