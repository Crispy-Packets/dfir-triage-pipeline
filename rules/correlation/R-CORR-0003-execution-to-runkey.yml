# Correlation chain 3 of 4. Compressed week, Day 3 (A-5).
#
# This is the rule the whole timestamp_type decision was made for. Read the
# window justification before changing anything here.

schema_version: "1.3.0"
id: R-CORR-0003
type: correlation
title: An executed binary is also registered to run at logon
enabled: true

description: >
  Joins an execution to a Run or RunOnce value naming the same executable.
  Claims that a binary which ran is also registered for autostart, and names
  both records. **Reports no interval between them, deliberately** - the
  registry step carries no time of its own that can be ordered against the
  execution. See the window justification.

severity: critical
weight: 85

attack:
  technique: T1547.001
  name: Boot or Logon Autostart Execution - Registry Run Keys / Startup Folder

select:
  event_type: [persistence_autorun]
  source_artifact: [registry]

conditions:
  all:
    - field: event_type
      op: equals
      value: persistence_autorun

steps:
  - name: execution
    select:
      event_type: [process_exec]
      source_artifact: [prefetch, evtx.security]
    conditions:
      all:
        - field: event_type
          op: equals
          value: process_exec
    in_window: true
    optional: false

  - name: persistence
    select:
      event_type: [persistence_autorun]
      source_artifact: [registry]
    conditions:
      all:
        - field: details.value_name
          op: present
        - field: details.key_last_write
          op: present
        # Added 2026-09-13. Without this the rule fires on every application
        # that runs and is also registered at logon -- msedge.exe,
        # onedrive.exe, securityhealthsystray.exe -- which is an inventory of
        # autostart software rather than a detection, at critical severity.
        #
        # A SHAPE predicate, not a name list. The rule's own notes rejected
        # suppressing those binaries by name as corpus-fitting that would not
        # survive a different estate; asking where the target lives is a
        # property of the finding. `invoice_scan.exe` sits in Downloads\ and
        # matches; msedge.exe sits in Program Files and does not.
        - field: path
          op: is_user_writable
          value: true
    in_window: false
    optional: false

join:
  on: [entity.exe_name]

window:
  from: execution
  to: execution
  min: PT0S
  max: PT1S
  justification: >
    Degenerate on purpose, and this is the important clause in the file. The
    window spans the execution step alone, because the persistence step is
    excluded from it - in_window is false and the finding reports no interval.

    D-027 is the measurement that forces this. The SecurityUpdate autorun in
    collection_s1_v2 carries a key last-write of 2026-08-21T01:34:07.976260Z
    while the download it points at is 2026-08-23T22:20:06.710763Z. The
    persistence is therefore 2 days 20h 46m OLDER than the file it launches,
    because the value was written during an earlier attempt at the scenario and
    the baseline restore before the recorded run did not clear it. The artifact
    is genuine persistence pointing at the genuine payload; only its timestamp
    belongs to a different attempt.

    Any window over [execution, persistence] therefore does one of two wrong
    things: it finds nothing, or - if widened past three days to "fix" that - it
    reports persistence preceding its own delivery and calls it a chain. A Run
    key's timestamp is the containing KEY's last-write time in any case, shared
    by every sibling value under it, so even without D-027 it could not carry an
    interval. details.value_count_in_key says how many siblings share it.

expected:
  clean_a: 1
  clean_b: 1
  s1_v2: 2
  clean_c: 1
  s1_v3: 2
  note: >
    **Remeasured 2026-09-13, after the is_user_writable condition was added to
    the persistence step.** All five figures above are post-change. The
    pre-change measurement is retained below because the change is only
    defensible against it.

    AS ORIGINALLY MEASURED 2026-08-30: clean_a 5, clean_b 5, s1_v2 5.

    The rule fired five times on a collection containing NO attack, at critical
    severity and weight 85. In clean_a: onedrive.exe, msedge.exe,
    onedrivesetup.exe, securityhealthsystray.exe and a cmd.exe RunOnce
    uninstaller. clean_b was the same five. On s1_v2 it also fired five times --
    onedrive.exe, msedge.exe, securityhealthsystray.exe, vboxtray.exe, and
    invoice_scan.exe. The identical count across all three collections was the
    clearest statement of the problem available: the scenario added one true
    positive and removed one benign one, and the total did not move. The rule
    was an inventory of autostart software with one real detection inside it.

    WHAT CHANGED. The persistence step now requires its target to be
    user-writable. That is a SHAPE predicate, not a name list -- this note
    previously rejected suppressing onedrive.exe and msedge.exe by name as
    corpus-fitting that would not survive a different estate, and that rejection
    still stands. Asking where a binary lives is a property of the finding:
    invoice_scan.exe sits in Downloads\ and matches, msedge.exe sits in
    Program Files and does not. The engine's `_is_user_writable` checks system
    locations first, so a Program Files path containing the substring "users"
    is correctly excluded.

    EFFECT. clean_a 5 -> 1, clean_b 5 -> 1, s1_v2 5 -> 2, and the surviving
    hits are the ones that matter: s1_v2 keeps invoice_scan.exe, s1_v3 keeps
    invoice_scan.exe. The remaining benign hit on each clean collection is
    per-user OneDrive under AppData\Local, which genuinely is a user-writable
    autorun and is the honest limit of this indicator -- identical in structure
    to the attack.

    WHAT THE BASE RATE STILL SAYS. One finding per clean host at critical
    severity is a substantially better claim than five, but it is not zero, and
    a critical finding still needs qualifying by what the entity is. The failure
    would be reporting the s1_v3 two as two detections.

order: any
